plugins {
    id("com.gradleup.nmcp.settings") version "1.6.2"
}
nmcpSettings {
    centralPortal {
        username = providers.gradleProperty("centralPortalUsername").orNull
        password = providers.gradleProperty("centralPortalPassword").orNull
        publishingType = "USER_MANAGED"
        publicationName = "$rootProject.name:$version"
    }
}

rootProject.name = 'ai.koryki.core'


dependencyResolutionManagement {
    // Do not allow subprojects to define other repositories
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        // Only koryki's own artifacts may come from the local repository: for developing against a
        // northwind or koryki change before it is published. Everything else comes from Central,
        // never from a stale local copy.
        //
        // It is listed first, so a local copy WINS over the released artifact of the same version.
        // That is what makes it useful and also the one way it bites: a `publishToMavenLocal` of a
        // version that later ships for real leaves a private artifact shadowing the public one, and
        // the build goes on passing on that machine alone. `rm -rf ~/.m2/repository/ai/koryki` when
        // a build succeeds locally and nowhere else.
        mavenLocal {
            content { includeGroupByRegex 'ai\\.koryki(\\..+)?' }
        }

        mavenCentral()
    }
}

include 'core'
include 'northwind'
include 'testkit'
include 'duckdb'
include 'postgresql'
include 'oracle'
include 'snowflake'
include 'trino'
include 'mariadb'
include 'mssql'
include 'sqlite'
include 'tools'
include 'kqlcore'

