plugins {
    id("com.gradleup.nmcp.settings") version "1.6.2"
}
nmcpSettings {
    centralPortal {
        username = providers.gradleProperty("centralPortalUsername").orNull
        password = providers.gradleProperty("centralPortalPassword").orNull
        publishingType = "USER_MANAGED"
        publicationName = "$rootProject.name:$version"
    }
}

rootProject.name = 'ai.koryki.core'


dependencyResolutionManagement {
    // Do not allow subprojects to define other repositories
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        // Only koryki's own artifacts may come from the local repository, for building against an
        // unreleased northwind; everything else comes from Central, never from a stale local copy.
        mavenLocal {
            content { includeGroupByRegex 'ai\\.koryki(\\..+)?' }
        }

        // Central Portal's "manual testing" endpoint: serves files from any of this account's
        // VALIDATED-but-not-yet-published deployments (USER_MANAGED, before the Publish click in
        // the portal UI) -- for testing a real release build before it goes public. Scoped the
        // same as mavenLocal above, for the same reason.
        //
        // Needs centralManualTestingAuthHeaderName/Value as Gradle properties (a Bearer token,
        // base64 of centralPortalUsername:centralPortalPassword) or every request to this repo
        // fails -- which is also every :core/:testkit build once a koryki-northwind version here
        // only exists as a pending deployment. Locally that means adding them to
        // ~/.gradle/gradle.properties yourself; build.yml and release.yml derive them from the
        // existing CENTRAL_PORTAL_USERNAME/PASSWORD secrets instead of storing a third one.
        //
        // Remove this repository, and that CI wiring, once koryki-northwind below is a real
        // release again and resolves from mavenCentral() like everything else.
        maven {
            name = 'centralManualTesting'
            url = 'https://central.sonatype.com/api/v1/publisher/deployments/download/'
            content { includeGroupByRegex 'ai\\.koryki(\\..+)?' }
            credentials(HttpHeaderCredentials)
            authentication { header(HttpHeaderAuthentication) }
        }
        mavenCentral()
    }
}

include 'core'
include 'northwind'
include 'testkit'
include 'duckdb'
include 'postgresql'
include 'oracle'
include 'snowflake'
include 'trino'
include 'mariadb'
include 'mssql'
include 'sqlite'
include 'tools'
include 'kqlcore'

