plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'The PostgreSQL dialect for koryki: renders the transpiler\'s intermediate query model as '  +
        'PostgreSQL SQL and adapts its JDBC driver -- identifier quoting, literal escaping, type '  +
        'and temporal mapping, and the functions PostgreSQL spells differently. Add alongside '  +
        'koryki-core, which does the transpiling.'

dependencies {

    implementation(libs.postgresql)
    implementation libs.jackson.databind

    // api, not implementation: this module's public types ARE core's -- PostgreSqlDialect is a
    // SqlDialect, PostgresqlDatabase a JdbcDatabase -- so nothing here can be compiled against
    // without core on the consumer's compile classpath. Declared as implementation it
    // reached the POM at runtime scope, and javac answered "cannot access SqlDialect"
    // for a consumer that depended on this artifact alone.
    api project(':core')
    testImplementation project(':northwind')
    testImplementation project(':testkit')
    testImplementation libs.koryki.catalog

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()

    systemProperty "postgresql.northwind.url", project.findProperty("postgresql.northwind.url")
    systemProperty "postgresql.northwind.user", project.findProperty("postgresql.northwind.user")
    systemProperty "postgresql.northwind.password", project.findProperty("postgresql.northwind.password")
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-postgresql'
        }
    }
}

tasks.register('PostgreSQLNorthwindScript', JavaExec) {

    systemProperty "postgresql.northwind.url", project.findProperty("postgresql.northwind.url")
    systemProperty "postgresql.northwind.user", project.findProperty("postgresql.northwind.user")
    systemProperty "postgresql.northwind.password", project.findProperty("postgresql.northwind.password")

    group = "application"
    description = "Build Northwind Database for PostgreSQL"

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.koryki.postgresql.northwind.BuildNorthwind'

    args
}