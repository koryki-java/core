group=ai.koryki.core
version=0.2.0

# Modules build and test side by side: the whole verification (compile, spotless, javadoc and every
# test suite, the six databases included) takes about 20 s instead of 38 s, with identical results.
#
# What makes it safe: no test writes to a shared database (Oracle's MixedCaseNameOracleTest creates
# and drops two scratch tables, in a database only that module uses), and no two modules share a
# file path -- each database copy in the temp directory belongs to exactly one module. The published
# artifacts are byte-identical either way (checked: 65 of 65). What is NOT tried in parallel is
# signing and the upload to Central, so the publish steps of the release workflow pass
# --no-parallel. If a run ever behaves differently from `./gradlew --no-parallel`, compare those
# two first.
org.gradle.parallel=true
