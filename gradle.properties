group=ai.koryki.core
version=0.1.0

# Central Portal's manual-testing endpoint (settings.gradle's centralManualTesting repository) is
# a live API, not a CDN-backed repository like mavenCentral() -- Gradle's default 30s connect/read
# timeouts aren't generous enough for it and one CI run timed out resolving koryki-northwind
# through it. Remove alongside that repository once koryki-northwind is a real release again.
systemProp.org.gradle.internal.http.connectionTimeout=90000
systemProp.org.gradle.internal.http.socketTimeout=90000