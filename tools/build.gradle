plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Build-time tooling for koryki: the shared list of documented dialects and '  +
        'samples that every documentation generator works from, and an audit over the '  +
        'function catalog for arguments with no declared type family. Not needed at runtime.'

dependencies {

    implementation libs.jackson.databind

    implementation project(':northwind')
    // DocDialects reads the fixture corpus through Fixtures.
    implementation project(':testkit')
    // api: DocDialects.Doc carries a SqlDialect and resolvers() hands out LinkResolvers, both
    // core types. The dialect modules below stay implementation -- they are read to build that
    // list, but what leaves this module is always the core interface, never their own classes.
    api project(':core')

    // Main scope, not test: DocDialects (below) lives in this sourceset now, so incubator::tools
    // can reuse it via the published koryki-tools jar instead of carrying its own copy.
    implementation project(':oracle')
    implementation project(':snowflake')
    implementation project(':mssql')
    implementation project(':postgresql')
    implementation project(':mariadb')
    implementation project(':sqlite')
    implementation project(':trino')

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    // Forward -Dgoldens.write=true to opt into regenerating the shared test-module
    // per-dialect SQL goldens (TestModuleGoldensTest#generateTestModuleGoldens).
    systemProperty 'goldens.write', System.getProperty('goldens.write', 'false')
    // EbnfExamplesTest checks the worked examples in this document, which lives outside the module
    // and is therefore not an input by default: editing it left the task UP-TO-DATE, so the very
    // change the test exists to check would not have run it. Measured before adding this line.
    inputs.file(file('../docs/KQL_EBNF.md'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('kqlEbnfDoc')
}

// FunctionDocGenerator, FunctionDocCoverage and FunctionDocsTest (the golden test that generated
// and verified docs/functions/*.md and docs/dialects/*.md here) moved to incubator's koryki-tools.
// This repo cannot depend on that module even at test scope -- it already depends on this repo's
// published jars, and the other direction would be a cycle. docs/functions/*.md and
// docs/dialects/*.md are therefore no longer self-verified by this repo's own build; that
// verification, plus the coverageReport worklist and publishing to the web project, now live
// entirely in incubator: ./gradlew :tools:test / :tools:coverageReport / :tools:publishFunctionDocs,
// run from there.

// Argument-type coverage audit (all overloads): ./gradlew :tools:argTypeAudit -q
tasks.register('argTypeAudit', JavaExec) {
    group = 'documentation'
    description = 'Reports function arguments (across all overloads) with no declared type family.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.docs.FunctionArgTypeAudit'
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-tools'
        }
    }
}
