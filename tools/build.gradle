plugins {
    id 'java'
    id 'maven-publish'
}

description = 'koryki tools'

java {
    withSourcesJar() // Optional: Creates the sources JAR
    withJavadocJar() // Optional: Creates the Javadoc JAR
}

dependencies {

    implementation libs.jackson.databind

    implementation project(':northwind')
    implementation project(':core')

    testImplementation project(':oracle')
    testImplementation project(':snowflake')
    testImplementation project(':mssql')
    testImplementation project(':postgresql')
    testImplementation project(':mariadb')
    testImplementation project(':sqlite')
    testImplementation project(':trino')

    // FunctionDocGenerator moved to incubator's koryki-tools -- that module also needs to publish
    // generated pages to a private docs site, which this (now public) repo shouldn't need to know
    // about. FunctionDocsTest still lives here and still calls it: this test verifies core's own
    // checked-in docs/functions/*.md and docs/dialects/*.md against the live catalog, and that
    // verification is still core's job even though the generator that does the comparing now lives
    // elsewhere.
    //
    // Excludes ai.koryki.core: koryki-incubator-tools was built against the PUBLISHED koryki-core
    // (from mavenLocal), and this build already supplies :core/:kqlcore/:northwind etc. as local
    // projects -- without the exclude, Gradle sees two different providers of the same capability
    // (the local project and the published jar pulled in transitively) and refuses to resolve.
    testImplementation(libs.koryki.incubator.tools) {
        exclude group: 'ai.koryki.core'
    }

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    // Forward -Ddocs.write=true from the CLI to the forked test JVM so the doc-golden
    // test (FunctionDocsTest) regenerates the pages instead of asserting.
    // (The DOCS_WRITE=true env var is inherited automatically; the -D property is not.)
    systemProperty 'docs.write', System.getProperty('docs.write', 'false')
    // Forward -Dgoldens.write=true to opt into regenerating the shared test-module
    // per-dialect SQL goldens (TestModuleGoldensTest#generateTestModuleGoldens).
    systemProperty 'goldens.write', System.getProperty('goldens.write', 'false')
    // EbnfExamplesTest checks the worked examples in this document, which lives outside the module
    // and is therefore not an input by default: editing it left the task UP-TO-DATE, so the very
    // change the test exists to check would not have run it. Measured before adding this line.
    inputs.file(file('../docs/KQL_EBNF.md'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('kqlEbnfDoc')
}

// Function doc-coverage worklist moved to incubator's koryki-tools (FunctionDocCoverage lives
// there now): ./gradlew :tools:coverageReport -q, run from the incubator repo.

// Argument-type coverage audit (all overloads): ./gradlew :tools:argTypeAudit -q
tasks.register('argTypeAudit', JavaExec) {
    group = 'documentation'
    description = 'Reports function arguments (across all overloads) with no declared type family.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.docs.FunctionArgTypeAudit'
}

// Publishing the generated docs to the web project moved to incubator's koryki-tools too
// (copyFunctionPages/copyDialectPages/copyFunctionIndex/publishFunctionDocs), since it is the
// module now handling anything that needs to know about that private site's layout. Run
// `./gradlew :tools:test` here first so what gets published is current, then
// `./gradlew :tools:publishFunctionDocs` from the incubator repo.

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-tools'
        }
    }
}
