plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Build-time tooling for koryki: the shared list of documented dialects and '  +
        'samples that every documentation generator works from, and an audit over the '  +
        'function catalog for arguments with no declared type family. Not needed at runtime.'

dependencies {

    implementation libs.jackson.databind

    implementation project(':northwind')
    // DocDialects reads the fixture corpus through Fixtures.
    implementation project(':testkit')
    // api: DocDialects.Doc carries a SqlDialect and resolvers() hands out LinkResolvers, both
    // core types. The dialect modules below stay implementation -- they are read to build that
    // list, but what leaves this module is always the core interface, never their own classes.
    api project(':core')

    // Main scope, not test: DocDialects (below) lives in this sourceset now, so incubator::tools
    // can reuse it via the published koryki-tools jar instead of carrying its own copy.
    implementation project(':oracle')
    implementation project(':snowflake')
    implementation project(':mssql')
    implementation project(':postgresql')
    implementation project(':mariadb')
    implementation project(':sqlite')
    implementation project(':trino')

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    // Forward -Dgoldens.write=true to opt into regenerating the shared test-module
    // per-dialect SQL goldens (TestModuleGoldensTest#generateTestModuleGoldens).
    systemProperty 'goldens.write', System.getProperty('goldens.write', 'false')
    // EbnfExamplesTest checks the worked examples in this document, which lives outside the module
    // and is therefore not an input by default: editing it left the task UP-TO-DATE, so the very
    // change the test exists to check would not have run it. Measured before adding this line.
    inputs.file(file('../docs/KQL_EBNF.md'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('kqlEbnfDoc')
}

// FunctionDocGenerator, FunctionDocCoverage and FunctionDocsTest (the golden test that generated
// and verified docs/functions/*.md and docs/dialects/*.md here) moved to incubator's tools module,
// published as ai.koryki.incubator:koryki-incubator-tools. This repo cannot depend on that module
// even at test scope -- it already depends on this repo's published jars, and the other direction
// would be a cycle. docs/functions/*.md and docs/dialects/*.md are therefore no longer
// self-verified by this repo's own build; that verification, plus the coverageReport worklist and
// publishing to the web project, live entirely in incubator, run from there:
//
//   ./gradlew :tools:test              -PcoreDocsDir=/path/to/koryki-java/core/docs
//   ./gradlew :tools:coverageReport -q
//   ./gradlew :tools:publishFunctionDocs -PcoreDocsDir=/path/to/koryki-java/core/docs
//
// coreDocsDir is not optional and has no default, by design -- but note that leaving it unset does
// NOT fail the publish: the Copy tasks then read from a path that does not exist, which Gradle
// treats as a no-op, so publishFunctionDocs reports success and copies nothing. Set it once in
// ~/.gradle/gradle.properties.

// Argument-type coverage audit (all overloads): ./gradlew :tools:argTypeAudit -q
tasks.register('argTypeAudit', JavaExec) {
    group = 'documentation'
    description = 'Reports function arguments (across all overloads) with no declared type family.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.docs.FunctionArgTypeAudit'
}

// The table of what each dialect declares for nested values, in docs/NESTED.md (see NestedSupportMatrix):
//   ./gradlew :tools:nestedMatrix
tasks.register('nestedMatrix', JavaExec) {
    group = 'documentation'
    description = 'Rewrites the generated dialect capability table in docs/NESTED.md.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.docs.NestedSupportMatrix'
    args rootProject.file('docs/NESTED.md').path
}

// The tree of every nested column of a catalog, from the spelling in dialectType (see TypeTrees):
//   ./gradlew :tools:typeTrees -Ptrees.args="db.json out.json"
tasks.register('typeTrees', JavaExec) {
    group = 'documentation'
    description = 'Writes the node tree of every nested column of a db.json.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.flatten.TypeTrees'
    doFirst {
        def given = project.findProperty('trees.args')
        if (given == null) {
            throw new GradleException('give the arguments: -Ptrees.args="db.json out.json"')
        }
        args = given.toString().split(' ').toList()
    }
}

// Views that flatten the list columns of a table into one row per element (see FlattenViews):
//   ./gradlew :tools:flattenViews -Pflatten.args="duckdb db.json model.json check_complex out items events"
tasks.register('flattenViews', JavaExec) {
    group = 'documentation'
    description = 'Writes the SQL, catalog and model entries of the flatten views of a table.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.flatten.FlattenViews'
    doFirst {
        def given = project.findProperty('flatten.args')
        if (given == null) {
            throw new GradleException('give the arguments: -Pflatten.args="dialect db.json model.json table out-directory [column ...]"')
        }
        args = given.toString().split(' ').toList()
    }
}

// Rewrites db.json files so that every column says its type and wording in a concept of its own:
//   ./gradlew :tools:migrateCatalogs -Pmigrate.args="a/db.json b/db.json"
tasks.register('migrateCatalogs', JavaExec) {
    group = 'documentation'
    description = 'Rewrites db.json files with a concept for every column.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.koryki.tools.migrate.MigrateCatalogs'
    doFirst {
        def given = project.findProperty('migrate.args')
        if (given == null) {
            throw new GradleException('give the files: -Pmigrate.args="a/db.json b/db.json"')
        }
        args = given.toString().split(' ').toList()
    }
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-tools'
        }
    }
}
