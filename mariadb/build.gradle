plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'The MariaDB dialect for koryki: renders the transpiler\'s intermediate query model as '  +
        'MariaDB SQL and adapts its JDBC driver -- identifier quoting, literal escaping, type and '  +
        'temporal mapping, and the functions MariaDB spells differently. Covers MySQL, which shares '  +
        'its dialect. Add alongside koryki-core, which does the transpiling.'

dependencies {

    implementation libs.mariadb
    implementation libs.jackson.databind

    // api, not implementation: this module's public types ARE core's -- MariadbDialect is a
    // SqlDialect, MariadbDatabase a JdbcDatabase -- so nothing here can be compiled against
    // without core on the consumer's compile classpath. Declared as implementation it
    // reached the POM at runtime scope, and javac answered "cannot access SqlDialect"
    // for a consumer that depended on this artifact alone.
    api project(':core')
    testImplementation project(':northwind')
    testImplementation project(':testkit')
    testImplementation libs.koryki.catalog

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()

    systemProperty "mariadb.northwind.url", project.findProperty("mariadb.northwind.url")
    systemProperty "mariadb.northwind.user", project.findProperty("mariadb.northwind.user")
    systemProperty "mariadb.northwind.password", project.findProperty("mariadb.northwind.password")
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-mariadb'
        }
    }
}

tasks.register('MariadbNorthwindScript', JavaExec) {

    systemProperty "mariadb.northwind.url", project.findProperty("mariadb.northwind.url")
    systemProperty "mariadb.northwind.user", project.findProperty("mariadb.northwind.user")
    systemProperty "mariadb.northwind.password", project.findProperty("mariadb.northwind.password")

    group = "application"
    description = "Build Northwind Database for mariadb"

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.koryki.mariadb.northwind.BuildNorthwind'

    args
}
