[versions]

antlr = "4.13.2"
jackson = "3.2.2"
# Jackson 3 keeps annotations at the 2.x group id and package (see jackson-databind pom).
# Per JSTEP-1 there is no 3.x annotations module; jackson-bom 3.2.1 pins the 2.x line to 2.22.
jackson-annotations = "2.22"
junit = "6.1.3"
# Artifacts of the northwind repository (koryki-java/northwind).
koryki-northwind = "0.1.1"

duckdb = "1.5.5.0"
h2database = "2.5.250"
postgresql = "42.7.13"
snowflake = "4.3.4"
oracle = "23.26.3.0.0"
trino = "483"
mariadb = "3.5.10"
# 13.4.0 is the newest stable; 13.5.0 exists only as -preview
mssql = "13.6.0.jre11"
sqlite = "3.53.4.0"

spotless = "8.10.2"
google-java-format = "1.36.1"

[plugins]
antlr = { id = "org.gradle.antlr"}

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]

koryki-catalog = { module = "ai.koryki.northwind:koryki-northwind-catalog", version.ref = "koryki-northwind" }
koryki-northwind-duckdb = { module = "ai.koryki.northwind:koryki-northwind-duckdb", version.ref = "koryki-northwind" }

duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
h2database = { module = "com.h2database:h2", version.ref = "h2database" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
snowflake = { module = "net.snowflake:snowflake-jdbc", version.ref = "snowflake" }
oracle = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle" }
trino = { module = "io.trino:trino-jdbc", version.ref = "trino" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }


antlr4 = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }


junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" } # version comes from BOM
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" } # version comes from BOM

[bundles]

