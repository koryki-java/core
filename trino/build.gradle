plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'The Trino dialect for koryki: renders the transpiler\'s intermediate query model as Trino '  +
        'SQL and adapts its JDBC driver -- identifier quoting, literal escaping, type and temporal '  +
        'mapping, and the functions Trino spells differently. Add alongside koryki-core, which does '  +
        'the transpiling.'

dependencies {

    implementation(libs.trino)
    implementation libs.jackson.databind

    // api, not implementation: this module's public types ARE core's -- TrinoDialect is a
    // SqlDialect, TrinoDatabase a JdbcDatabase -- so nothing here can be compiled against
    // without core on the consumer's compile classpath. Declared as implementation it
    // reached the POM at runtime scope, and javac answered "cannot access SqlDialect"
    // for a consumer that depended on this artifact alone.
    api project(':core')
    testImplementation project(':northwind')
    testImplementation project(':testkit')
    testImplementation libs.koryki.catalog

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    systemProperty "trino.northwind.url", project.findProperty("trino.northwind.url")
    systemProperty "trino.northwind.user", project.findProperty("trino.northwind.user")
    systemProperty "trino.northwind.password", project.findProperty("trino.northwind.password")

}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-trino'
        }
    }
}
