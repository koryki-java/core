plugins {
    id 'java'
    id 'maven-publish'
}

description = 'koryki oracle databases and services'

java {
    withSourcesJar() // Optional: Creates the sources JAR
    withJavadocJar() // Optional: Creates the Javadoc JAR
}

dependencies {

    // compileOnly, not implementation: this module must not redistribute Oracle's driver.
    // Oracle's Free Use Terms permit redistributing it unmodified only if end users aren't
    // charged an additional fee for it -- a condition that doesn't survive shipping inside a
    // paid artifact. Compiling against it is fine (development/internal use is unconditionally
    // covered); a consumer of koryki-oracle supplies ojdbc11 themselves.
    compileOnly(libs.oracle)
    implementation libs.jackson.databind

    implementation project(':core')
    testImplementation project(':northwind')
    testImplementation project(':testkit')
    testImplementation libs.koryki.catalog

    // Test-only, and deliberately so: the driver is needed to run the live integration tests
    // (OracleAvailabilityCondition, BuildNorthwind, the *OracleEngineTest suite) against a real
    // Oracle instance, not to compile the module -- the consumer brings their own at runtime.
    testImplementation(libs.oracle)

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()

    systemProperty "oracle.northwind.url", project.findProperty("oracle.northwind.url")
    systemProperty "oracle.northwind.user", project.findProperty("oracle.northwind.user")
    systemProperty "oracle.northwind.password", project.findProperty("oracle.northwind.password")
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-oracle'
        }
    }
}

tasks.register('OracleNorthwindScript', JavaExec) {

    systemProperty "oracle.northwind.url", project.findProperty("oracle.northwind.url")
    systemProperty "oracle.northwind.user", project.findProperty("oracle.northwind.user")
    systemProperty "oracle.northwind.password", project.findProperty("oracle.northwind.password")

    group = "application"
    description = "Build Northwind Database for ORACLE"

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.koryki.oracle.northwind.BuildNorthwind'

    args
}