name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'snapshot'
        type: choice
        options: [snapshot, release]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tests read the fixture corpus from the northwind-fixtures submodule.
          submodules: true

      - name: Check tag matches version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Publish to playground (snapshot)
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'snapshot'
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          ./gradlew publishAggregationToCentralSnapshots --no-daemon -Pversion="${version%-SNAPSHOT}-SNAPSHOT"

      - name: Check signing key
        if: github.event_name == 'push' || inputs.target == 'release'
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is not set; the build would publish unsigned artifacts, which Central rejects"
            exit 1
          fi

      - name: Publish real release
        if: github.event_name == 'push' || inputs.target == 'release'
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
