name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly: the rule set grows, so a history that was clean last month may not be.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not just the tip: a key committed and reverted long ago is still
          # published once the repository is public, and is what has to be rotated.
          fetch-depth: 0

      # The gitleaks CLI, pinned by version and SHA-256 like the Gradle distribution. Not
      # gitleaks-action, which requires a paid licence key for organisation-owned repositories.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # --redact: a finding must not be printed in full into a public build log.
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --exit-code 1
