plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Ready-made koryki services for the Northwind sample database: a catalog-backed '  +
        'resolver and a DuckDB-backed engine, so a KQL query can be run against a real '  +
        'dataset without assembling one. The schema and the data themselves are separate '  +
        'artifacts, ai.koryki.northwind:koryki-northwind-catalog and :koryki-northwind-duckdb.'

dependencies {
    implementation libs.jackson.databind

    // api for both: NorthwindService hands out core's LinkResolver, Database, SqlRenderer and
    // Engine, and NorthwindDuckdb returns a DuckdbDatabase. Every one of those is in a public
    // signature here, so a consumer needs both on its compile classpath, not just at runtime.
    api project(':core')
    api project(':duckdb')

    // Files only, read from the classpath at runtime: the catalog (db.json, model.json) and the
    // Northwind database for DuckDB, both from the northwind repository.
    runtimeOnly libs.koryki.catalog
    runtimeOnly libs.koryki.northwind.duckdb

    // JUnit for this module's own tests only. The harness other modules test with is koryki-testkit,
    // so that applications using the Northwind database do not get JUnit on their runtime path.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        // Define the publication for this subproject
        mavenJava(MavenPublication) {
            // The 'java' component includes the main JAR artifact and its transitive dependencies
            from components.java

            // Optionally, override the artifact ID (defaults to project name: 'api')
            artifactId = 'koryki-northwind'
        }
    }
}
